[project]
name = "mov-to-fan-count"
version = "0.1.0"
description = "ウマ娘の動画からファン人数をOCRで抽出するツール"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.8.0",
    "meikiocr>=0.1.0",
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gemma4 = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
mov-to-fan-count = "cli.main:main"
mov-to-fan-count-gui = "gui.__main__:main"

[tool.pytest.ini_options]
# old/ は旧アーキテクチャのバックアップであり、tests/ とパッケージ名が衝突するため収集対象外とする
testpaths = ["tests"]
markers = [
    "slow: フル動画 E2E テスト（数十秒〜数分。デフォルトでは MOV_E2E=1 でオプトインして実行）",
]

[tool.setuptools.packages.find]
include = ["src*", "cli*", "gui*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
