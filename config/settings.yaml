card_detection:
  badge_match_threshold: 0.6
  coarse_scale: 0.5
  coarse_to_fine: true
  edge_margin: 8
  enabled: true
  fan_width: 280
  icon_match_threshold: 0.7
  label_match_threshold: 0.7
  max_cards: 3
  max_name_width: 400
  multi_scale: true
  name_margin: 8
  name_v_margin: 10
  reference_width: 2560
  refine_radius: 200
  scale_cache: true
  scale_step: 0.05
  scale_window_high: 1.3
  scale_window_low: 0.8
  template_dir: template
general:
  language: ja
  platform: windows
name_mapping:
  edit_distance_threshold: 2
  enable: false
  file: config/name_mapping.json
  unmapped_action: suggest
  warn_on_approx: true
ocr:
  cache: true
  engine: meiki
  gemma4:
    enabled: false
    model_path: ./models
  meiki:
    fan_det_threshold: 0.3
    fan_rec_threshold: 0.05
    name_det_threshold: 0.3
    name_det_threshold_low: 0.2
    name_rec_threshold: 0.2
    name_rec_threshold_low: 0.1
output:
  auto_timestamp: true
  csv_dir: output/csv
  json_dir: output/json
text_region:
  enabled: false
  use_percent: false
video:
  diff_only: false
  diff_threshold: 0.03
  enable_diff_check: true
  frame_interval: 0.0
  resolution: 2560x1072
